name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      package_fixture: ${{ steps.filter.outputs.package_fixture }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'code/client/**'
              - 'docs/CLIENT_RENDERING.md'
              - '.github/workflows/ci.yml'
            server:
              - 'code/server/src/**'
              - 'code/server/sql/**'
              - 'code/server/tests/**'
              - 'code/server/pyproject.toml'
              - 'docs/API_REFERENCE.md'
              - 'docs/SERVER_PIPELINE.md'
              - '.github/workflows/ci.yml'
            package_fixture:
              - 'code/client/**'
              - 'examples/public-library-host/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'code/server/Dockerfile'
              - 'code/server/.dockerignore'
              - 'code/server/compose.yaml'
              - 'code/server/scripts/container-smoke.sh'
              - 'code/server/sql/**'
              - 'code/server/src/**'
              - 'code/server/pyproject.toml'
              - '.github/workflows/ci.yml'

  client:
    name: Client validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build demo
        run: npm run build

      - name: Build library
        run: npm run build:lib

  server:
    name: Server validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/server/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,dev]'

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  packed-package-consumer:
    name: Packed-package consumer
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.package_fixture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            code/client/package-lock.json
            examples/public-library-host/package-lock.json

      - name: Install client dependencies
        working-directory: code/client
        run: npm ci

      - name: Build library
        working-directory: code/client
        run: npm run build:lib

      - name: Pack library
        working-directory: code/client
        run: npm pack

      - name: Install fixture dependencies
        working-directory: examples/public-library-host
        run: npm ci

      - name: Build fixture
        working-directory: examples/public-library-host
        run: npm run build

  docker-service:
    name: Docker service validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: code/server
          load: true
          platforms: linux/arm64
          tags: phylo-lens-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test service image
        working-directory: code/server
        run: DOCKER_PLATFORM=linux/arm64 SKIP_BUILD=1 IMAGE_NAME=phylo-lens-service:ci ./scripts/container-smoke.sh
