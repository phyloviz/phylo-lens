name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    client:
        name: Client Build and Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: code/client

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: code/client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Test
              run: npm test -- --run

    server:
        name: Server Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: code/server

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .[test]

            - name: Test
              run: pytest -q
