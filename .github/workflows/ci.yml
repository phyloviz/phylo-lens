name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      package_fixture: ${{ steps.filter.outputs.package_fixture }}
      docker: ${{ steps.filter.outputs.docker }}
      rq2_eval: ${{ steps.filter.outputs.rq2_eval }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            client:
              - 'code/client/**'
              - 'docs/CLIENT_RENDERING.md'
              - '.github/workflows/ci.yml'
            server:
              - 'code/server/src/**'
              - 'code/server/sql/**'
              - 'code/server/tests/**'
              - 'code/server/pyproject.toml'
              - 'docs/API_REFERENCE.md'
              - 'docs/SERVER_PIPELINE.md'
              - '.github/workflows/ci.yml'
            package_fixture:
              - 'code/client/**'
              - 'examples/public-library-host/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'code/server/Dockerfile'
              - 'code/server/.dockerignore'
              - 'code/server/compose.yaml'
              - 'code/server/phylolib.jar.sha256'
              - 'code/server/scripts/container-smoke.sh'
              - 'code/server/sql/**'
              - 'code/server/src/**'
              - 'code/server/pyproject.toml'
              - '.github/workflows/ci.yml'
            rq2_eval:
              - 'eval/**'
              - 'code/client/**'
              - 'code/server/src/**'
              - 'code/server/pyproject.toml'
              - '.github/workflows/ci.yml'

  client:
    name: Client validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/client
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build demo
        run: npm run build

      - name: Build library
        run: npm run build:lib

  server:
    name: Server validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/server/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,dev]'

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests
      - name: Test
        run: pytest -q

  packed-package-consumer:
    name: Packed-package consumer
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.package_fixture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            code/client/package-lock.json
            examples/public-library-host/package-lock.json

      - name: Build packed-package consumer
        run: ./scripts/packed-package-consumer-smoke.sh

  rq2-evaluation:
    name: RQ2 evaluation smoke
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rq2_eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            code/client/package-lock.json
            eval/browser/package-lock.json

      - name: Build public client package
        working-directory: code/client
        run: |
          npm ci
          npm run build:lib

      - name: Install browser dependencies
        working-directory: eval/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run format:check
          npm run lint
          npm test
          npm run typecheck
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            code/server/pyproject.toml
            eval/pyproject.toml

      - name: Run RQ2 Python tests and smoke
        env:
          RQ2_SMOKE: "1"
          RQ3_SMOKE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'code/server[test]'
          python -m pip install -e 'eval[test,dev]'
          (cd eval && python -m ruff check src tests && python -m ruff format --check src tests)
          PYTHONPATH=eval/src:code/server/src python -m pytest -q eval/tests

  docker-service:
    name: Docker service validation (${{ matrix.suffix }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        if: matrix.suffix == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: code/server
          load: true
          platforms: ${{ matrix.platform }}
          tags: phylo-lens-service:ci-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test service image
        working-directory: code/server
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
          IMAGE_NAME: phylo-lens-service:ci-${{ matrix.suffix }}
          SKIP_BUILD: "1"
        run: ./scripts/container-smoke.sh
