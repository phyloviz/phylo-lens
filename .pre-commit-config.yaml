repos:
  - repo: local
    hooks:
      - id: server-ruff-fix-and-format
        name: server ruff check and format
        entry: sh code/server/scripts/pre-commit.sh
        language: system
        pass_filenames: false
        always_run: true
        files: ^code/server/src/
      - id: client-format-lint-build
        name: client format, lint, and build
        entry: sh -c 'cd code/client && npm run format:check && npm run lint && npm run build'
        language: system
        pass_filenames: false
        always_run: true
        files: ^(code/client|examples/public-library-host)/
