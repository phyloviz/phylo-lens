<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhyloLens Client Demo</title>
    <style>
      :root {
        --bg: #000000; /* f4f7fb */
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-2: #115e59;
        --border: #d1d5db;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 10%, #dff3ee, transparent 35%),
          var(--bg);
      }

      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 0.92rem;
      }

      input,
      select,
      textarea {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        background: white;
      }

      select[multiple] {
        height: auto;
        min-height: 46px;
        max-width: 100%;
        overflow: auto;
      }

      select[multiple] option {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      button {
        width: fit-content;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-2);
      }

      #status {
        margin-top: 12px;
        font-weight: 600;
      }

      #graph-root {
        margin-top: 14px;
        min-height: 620px;
        height: 72vh;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: #f8fafc;
      }

      #ancillary-wheel {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #f8fafc;
        padding: 12px;
      }

      .wheel-controls {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        align-items: start;
      }

      .wheel-controls label {
        margin: 0;
      }

      .search-controls {
        margin-top: 14px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      #search-results {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .search-result {
        border: 1px solid var(--border);
        background: #f8fafc;
        color: var(--text);
        padding: 8px 10px;
      }

      .search-result:hover {
        background: #eef2f7;
      }

      .lod-playback {
        display: grid;
        grid-template-columns: repeat(2, minmax(88px, 1fr));
        gap: 8px;
      }

      .lod-playback button {
        width: 100%;
      }

      .lod-playback button[disabled] {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .category-color-controls {
        display: grid;
        gap: 6px;
        max-height: 180px;
        overflow: auto;
      }

      .category-color-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      .category-color-actions input {
        display: none;
      }

      .category-color-actions button {
        width: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafc;
        color: var(--text);
        padding: 7px 10px;
        cursor: pointer;
      }

      .category-color-actions button:hover {
        background: #eef2f7;
      }

      .category-color-row {
        display: grid;
        grid-template-columns: 32px minmax(80px, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .category-color-row input {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        cursor: pointer;
      }

      .category-color-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .category-color-count,
      .category-color-empty {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .ancillary-wheel {
        display: grid;
        grid-template-columns: minmax(210px, 260px) 1fr;
        gap: 16px;
        align-items: center;
      }

      .ancillary-wheel-empty {
        margin: 0;
        color: var(--muted);
      }

      .wheel-chart {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        position: relative;
        border: 1px solid var(--border);
      }

      .wheel-center {
        position: absolute;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        text-align: center;
      }

      .wheel-center span {
        font-size: 0.74rem;
        color: var(--muted);
      }

      .wheel-center strong {
        font-size: 1rem;
      }

      .wheel-meta p {
        margin: 0 0 8px;
      }

      .wheel-meta ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
      }

      .wheel-meta li {
        display: grid;
        grid-template-columns: 14px 1fr auto;
        gap: 8px;
        align-items: center;
        font-size: 0.92rem;
      }

      .wheel-meta .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      @media (max-width: 860px) {
        main {
          padding: 14px;
        }

        #graph-root {
          min-height: 460px;
          height: 58vh;
        }

        .ancillary-wheel {
          grid-template-columns: 1fr;
        }

        .wheel-controls {
          grid-template-columns: 1fr;
        }

        .wheel-chart {
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>PhyloLens Demo Shell</h1>
        <p>
          Paste a weighted Newick tree and submit. This demo validates the
          distance-threshold server pipeline and Sigma-based slice rendering.
        </p>

        <form id="render-form">
          <label>
            Dataset Name
            <input id="dataset-name-input" type="text" value="demo-tree" />
          </label>

          <label>
            Newick Input
            <textarea id="newick-input">
((A:1,B:1)X:2,(C:3,D:5)Y:4)Root;</textarea
            >
          </label>

          <label>
            Newick File
            <input
              id="newick-file-input"
              type="file"
              accept=".nwk,.newick,.tree,.txt"
            />
          </label>

          <div class="wheel-controls">
            <label>
              Ancillary Table
              <input
                id="ancillary-file-input"
                type="file"
                accept=".csv,.tsv,.txt"
              />
            </label>
            <label>
              Join Column
              <input
                id="ancillary-join-column-input"
                type="text"
                value="isolate"
              />
            </label>
            <label>
              Table Format
              <select id="ancillary-format">
                <option value="auto" selected>Auto</option>
                <option value="tsv">TSV</option>
                <option value="csv">CSV</option>
              </select>
            </label>
          </div>

          <label>
            Advanced Ancillary JSON (optional)
            <textarea
              id="ancillary-input"
              placeholder='{"metadata_by_node_id":{"a":{"country":"Portugal"}}}'
            ></textarea>
          </label>

          <div class="wheel-controls">
            <label>
              Initial LoD Zoom
              <input
                id="initial-zoom-input"
                type="number"
                min="0"
                step="0.5"
                value="1"
              />
            </label>
            <label>
              Max Visible Nodes
              <input
                id="max-nodes-input"
                type="number"
                min="10"
                step="50"
                value="3010"
              />
            </label>
            <label>
              LoD
              <span class="lod-playback">
                <button id="lod-play-button" type="button" disabled>
                  Play
                </button>
                <button id="lod-pause-button" type="button" disabled>
                  Pause
                </button>
              </span>
            </label>
            <label>
              Wheel Scope
              <select id="ancillary-mode">
                <option value="global" selected>
                  Global (all rendered nodes)
                </option>
                <option value="current">Current graph snapshot</option>
                <option value="selected">Selected node only</option>
              </select>
            </label>
            <label>
              Pie Field
              <select id="metadata-pie-field" multiple size="5" disabled>
                <option value="">Auto pie fields</option>
              </select>
            </label>
            <label>
              Size Field
              <input
                id="metadata-size-field"
                type="text"
                value="profile_count"
              />
            </label>
            <label>
              Size Scale
              <select id="metadata-size-scale">
                <option value="linear" selected>Linear</option>
                <option value="log">Logarithmic</option>
              </select>
            </label>
            <label>
              Category Colors
              <span class="category-color-actions">
                <button id="palette-load-button" type="button">Load</button>
                <input
                  id="palette-load-input"
                  type="file"
                  accept=".txt,.palette,.json,application/json,text/plain"
                />
                <button id="palette-save-button" type="button">Save</button>
              </span>
              <span id="palette-controls" class="category-color-controls"></span>
            </label>
            <label>
              Options
              <select id="display-options" multiple size="3">
                <option value="node-labels" selected>Node labels</option>
                <option value="edge-distance-labels">
                  Edge distance labels
                </option>
                <option value="distance-weighted-edges">
                  Distance-weighted edges
                </option>
              </select>
            </label>
            <label>
              Node
              <select id="ancillary-node" disabled>
                <option value="">Select node</option>
              </select>
            </label>
          </div>

          <div class="search-controls">
            <label>
              Search
              <input
                id="search-input"
                type="search"
                placeholder="Node id or metadata"
              />
            </label>
            <button id="search-button" type="button">Search</button>
          </div>
          <div id="search-results"></div>

          <button type="submit">Normalize and Render</button>
        </form>

        <div id="status" aria-live="polite"></div>
        <div id="graph-root" aria-label="Graph render container"></div>
        <div id="ancillary-wheel" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
