[project]
name = "phylo-lens-server"
version = "0.1.1"
description = "PhyloLens server for deterministic phylogenetic normalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0"
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2.0,<4.0.0"
]
test = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0"
]
dev = [
  "pre-commit>=3.8.0,<5.0.0",
  "ruff==0.16.0"
]

[project.scripts]
phylo-lens-server = "phylo_lens_server.main:run"
phylo-lens-init-postgres = "phylo_lens_server.cli.init_postgres:main"
phylo-lens-prepare-worker = "phylo_lens_server.cli.prepare_worker:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"sql/postgres" = ["sql/postgres/create-schema.sql"]
"sql/sqlite" = ["sql/sqlite/create-schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
