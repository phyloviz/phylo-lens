[project]
name = "phylo-lens-server"
version = "0.1.0"
description = "PhyloLens server for deterministic phylogenetic normalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0"
]
dev = [
  "pre-commit>=3.8.0,<5.0.0",
  "ruff>=0.6.0,<1.0.0"
]

[project.scripts]
phylo-lens-server = "phylo_lens_server.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
