services:
  phylo-lens-service:
    image: ghcr.io/phyloviz/phylo-lens-service:0.2.1
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      PHYLO_LENS_DATA_DIR: /data
      PHYLO_LENS_PORT: "8000"
      PHYLO_LENS_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - phylo-lens-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); raise SystemExit(0 if json.load(response).get('status') == 'ok' else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  phylo-lens-data:
