default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - test

client_test:
  stage: test
  image: node:20-bookworm-slim
  timeout: 20m
  before_script:
    - node --version
    - npm --version
  script:
    - cd code/client
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    - npm test
  cache:
    key:
      files:
        - code/client/package-lock.json
    paths:
      - code/client/.npm/

server_test:
  stage: test
  image: python:3.11-slim
  timeout: 20m
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/code/server/.pip-cache"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - python --version
    - pip --version
  script:
    - cd code/server
    - python -m pip install --upgrade pip setuptools wheel
    - python -m pip install -e '.[test]'
    - python -m pytest -q
  cache:
    key:
      files:
        - code/server/pyproject.toml
    paths:
      - code/server/.pip-cache/
