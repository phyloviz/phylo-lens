site_name: PhyloLens
site_description: Explore fully labelled trees and minimum spanning forests with scalable levels of detail.
site_url: https://phyloviz.github.io/phylo-lens/
repo_url: https://github.com/phyloviz/phylo-lens
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: readthedocs
  navigation_depth: 3
  collapse_navigation: false
  highlightjs: false
extra_css:
  - assets/manual.css
extra_javascript:
  - path: assets/diagrams.mjs
    type: module
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
plugins:
  - search
hooks:
  - scripts/docs_hooks.py
exclude_docs: |
  README.md
  requirements.txt
  reviews/
  feedback/
  validation/
  figures/
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Using PhyloLens:
      - Visual walkthrough: walkthrough.md
      - User guide: USER_GUIDE.md
      - Input formats: INPUT_FORMATS.md
      - Technical roots: REROOTING.md
      - Distance operations: DISTANCE_OPERATIONS.md
      - Expanding and folding: EXPAND_COLLAPSE.md
      - Search: SEARCH.md
  - Integrating PhyloLens:
      - Choose your components: INTEGRATION.md
      - Browser library API: client-api.md
      - Server setup: server-guide.md
      - HTTP API: API_REFERENCE.md
  - How it works:
      - Architecture: ARCHITECTURE_SPEC.md
      - Runtime flow: flow.md
      - Data model: DATA_MODEL.md
      - Ancillary data: ancillary-domain.md
      - Preparation pipeline: SERVER_PIPELINE.md
      - Levels of detail: LOD_AND_CLUSTERING.md
      - Tree indexing: TREE_INDEX.md
      - Rendering: CLIENT_RENDERING.md
      - Algorithms and references: ALGORITHM_REFERENCES.md
  - Maintaining the project:
      - Documentation site: DOCUMENTATION_SITE.md
      - Documentation map: documentation-map.md
      - Releases: RELEASE.md
