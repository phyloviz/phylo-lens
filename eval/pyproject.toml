[project]
name = "phylo-lens-eval"
version = "0.1.0"
description = "Reproducible PhyloLens thesis evaluation harnesses"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
dev = ["ruff==0.16.0"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../code/server/src"]
